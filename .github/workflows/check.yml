name: check

# Pull request: unit (syntax, unit tests, CSS, manifest, changelog), then integration (the whole plugin in a fake
# Tern with recorded omp and GitHub answers) on Linux, Windows and macOS. Branch protection requires both before a
# merge. Push to main: the same, then a release when plugin.toml names a version that has none yet.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LUAU_VERSION: "0.743"

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/luau
        with:
          version: ${{ env.LUAU_VERSION }}
      - run: python scripts/check.py

  integration:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/luau
        with:
          version: ${{ env.LUAU_VERSION }}
      - run: python scripts/check.py --integration

  # A version in plugin.toml without a release yet becomes one, its notes taken from CHANGELOG.md.
  release:
    needs: [unit, integration]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the plugin.toml version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' plugin.toml)
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v is already released"
            exit 0
          fi
          awk -v v="$v" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          gh release create "v$v" --title "v$v" --notes-file notes.md --target "$GITHUB_SHA"
